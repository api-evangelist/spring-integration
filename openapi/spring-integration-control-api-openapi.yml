openapi: 3.2.0
info:
  title: Spring Integration Management Control API
  description: The Spring Integration Management REST API exposes endpoints for monitoring and controlling Spring Integration components at runtime. It provides access to message channel statistics, message handler metrics, integration graph visualization, and component lifecycle management (start/stop).
  version: 6.3.0
  contact:
    name: Spring Team
    url: https://spring.io/projects/spring-integration
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:8080/api
  description: Default management API base path
tags:
- name: Control
paths:
  /controlBus:
    post:
      operationId: sendControlBusCommand
      summary: Send Control Bus Command
      description: Sends a SpEL expression command to the Spring Integration Control Bus
      tags:
      - Control
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              example: '@myPoller.start()'
      responses:
        '200':
          description: Command executed
        '400':
          description: Invalid command
