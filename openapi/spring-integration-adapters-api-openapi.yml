openapi: 3.2.0
info:
  title: Spring Integration Management Adapters API
  description: The Spring Integration Management REST API exposes endpoints for monitoring and controlling Spring Integration components at runtime. It provides access to message channel statistics, message handler metrics, integration graph visualization, and component lifecycle management (start/stop).
  version: 6.3.0
  contact:
    name: Spring Team
    url: https://spring.io/projects/spring-integration
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:8080/api
  description: Default management API base path
tags:
- name: Adapters
paths:
  /inboundChannelAdapters:
    get:
      operationId: listInboundAdapters
      summary: List Inbound Channel Adapters
      description: Returns all inbound channel adapters and their running status
      tags:
      - Adapters
      responses:
        '200':
          description: List of inbound adapters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterList'
  /inboundChannelAdapters/{name}:
    get:
      operationId: getInboundAdapter
      summary: Get Inbound Adapter Details
      description: Returns details and status for a specific inbound channel adapter
      tags:
      - Adapters
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Adapter details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adapter'
        '404':
          description: Adapter not found
    post:
      operationId: controlInboundAdapter
      summary: Start or Stop Inbound Adapter
      description: Controls the lifecycle of an inbound channel adapter
      tags:
      - Adapters
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - start
                  - stop
      responses:
        '200':
          description: Adapter state changed
        '404':
          description: Adapter not found
components:
  schemas:
    Adapter:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        running:
          type: boolean
        outputChannelName:
          type: string
    AdapterList:
      type: object
      properties:
        adapters:
          type: array
          items:
            $ref: '#/components/schemas/Adapter'
