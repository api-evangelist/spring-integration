openapi: 3.2.0
info:
  title: Spring Integration Management History API
  description: The Spring Integration Management REST API exposes endpoints for monitoring and controlling Spring Integration components at runtime. It provides access to message channel statistics, message handler metrics, integration graph visualization, and component lifecycle management (start/stop).
  version: 6.3.0
  contact:
    name: Spring Team
    url: https://spring.io/projects/spring-integration
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:8080/api
  description: Default management API base path
tags:
- name: History
paths:
  /messageHistory:
    get:
      operationId: getMessageHistory
      summary: Get Message History Configuration
      description: Returns the current message history tracking configuration
      tags:
      - History
      responses:
        '200':
          description: Message history config
          content:
            application/json:
              schema:
                type: object
